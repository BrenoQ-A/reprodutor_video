<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Player de Sinalização</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    min-width: 1280px;
    min-height: 720px;
    background: #050505;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: #EDEDEA;
  }
  /* Modo device (Android WebView/APK): sem piso de 1280x720, o layout
     acompanha 1:1 a resolução que o aparelho reporta. */
  .device-fit,
  .device-fit body {
    min-width: 0;
    min-height: 0;
  }
  #stage-outer {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    display: table;
    width: 100%;
    height: 100%;
    background: #050505;
  }
  #stage-inner {
    display: table-cell;
    vertical-align: middle;
    text-align: center;
  }
  #stage-inner img, #stage-inner video {
    display: block;
    margin: 0 auto;
  }
  #hud {
    position: absolute;
    right: 18px;
    bottom: 14px;
    font-family: monospace;
    font-size: 14px;
    color: #B8B8B4;
    z-index: 10;
  }
  #progress-track {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 3px;
    width: 100%;
    background: transparent;
    z-index: 10;
  }
  #progress-bar {
    height: 3px;
    width: 0%;
    background: #FFB454;
  }
  #message {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    text-align: center;
    padding-top: 35%;
    background: #050505;
    z-index: 20;
  }
  #message h1 {
    font-size: 17px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 0 0 12px 0;
  }
  #message p {
    font-size: 14px;
    color: #B8B8B4;
    margin: 0 auto;
    max-width: 680px;
    line-height: 1.5;
  }
  #message code {
    font-family: monospace;
    background: #222;
    padding: 2px 6px;
  }
</style>
</head>
<body>
<div id="stage-outer"><div id="stage-inner"></div></div>
<div id="progress-track"><div id="progress-bar"></div></div>
<div id="hud"></div>
<div id="message">
  <h1 id="message-title">Iniciando player</h1>
  <p id="message-text">Carregando configuração...</p>
</div>

<script src="player-core.js"></script>
<script>
/*
  Ajuste de layout por ambiente (correção APK/Android TV).

  Dentro do APK o WebView obedece à meta viewport (navegadores de desktop
  ignoram), e com width=1280 a página era desenhada em 1280x720 CSS e
  reescalonada pelo aparelho — fonte de imagem borrada/enquadramento errado.

  - Detecta Android WebView pelo token "; wv)" do User-Agent e troca a meta
    para width=device-width (render 1:1, sem reescalonamento).
  - ?viewport=device|1280 força o modo; ?fit=cover|contain|stretch escolhe o
    enquadramento (no WebView o padrão passa a ser cover, igual aos players
    legados; em Tizen/desktop nada muda).

  Roda depois do player-core.js e antes do script principal, que lê
  window.__PLAYER_LAYOUT__ no boot.
*/
(function () {
  var query = String(window.location.search || '').replace(/^\?/, '').split('&');
  var param = function (name) {
    for (var i = 0; i < query.length; i++) {
      var pair = query[i].split('=');
      if (decodeURIComponent(pair[0] || '') === name) {
        return decodeURIComponent(String(pair.slice(1).join('=') || '').replace(/\+/g, ' '));
      }
    }
    return '';
  };
  var isAndroidWebView = false;
  if (typeof navigator !== 'undefined' && navigator.userAgent) {
    isAndroidWebView = /;\s*wv\)/.test(navigator.userAgent);
  }
  var requested = param('viewport').toLowerCase();
  var mode = requested === 'device' || requested === '1280'
    ? requested
    : (isAndroidWebView ? 'device' : '1280');
  var fit = param('fit').toLowerCase();
  if (fit !== 'cover' && fit !== 'contain' && fit !== 'stretch') {
    fit = mode === 'device' ? 'cover' : 'contain';
  }
  if (mode === 'device') {
    if (document.querySelector) {
      var meta = document.querySelector('meta[name="viewport"]');
      if (meta) {
        meta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
      }
    }
    if (document.documentElement.classList) {
      document.documentElement.classList.add('device-fit');
    } else {
      document.documentElement.className += ' device-fit';
    }
  }
  window.__PLAYER_LAYOUT__ = { deviceMode: mode === 'device', fitMode: fit };
}());
</script>
<script>
(function () {
  /*
    Compatível com Samsung Smart Hub N14M / navegador WebKit legado.
    Implementação deliberadamente restrita a JavaScript ES5 e CSS clássico.
  */
  var BOOTSTRAP = {
    playlistUrl: '',
    devicesUrl: '',
    configUrl: '',
    playlistCheckSeconds: 5
  };

  var CONFIG = {
    imageDurationSeconds: 15,
    pollIntervalMinutes: 5,
    showHud: true,
    autoReloadHours: 6,
    targetVolume: 0.8,
    videoVolumeOverrides: {},
    fillBorderColor: true,
    musicEnabled: false,
    musicPlaylist: [],
    imageMusicDurationSeconds: 40,
    musicVolume: 0.5
  };

  var IMAGE_EXT = ['jpg', 'jpeg', 'png'];
  var VIDEO_EXT = ['mp4'];
  var playlist = [];
  var index = -1;
  var currentId = null;
  var advanceTimer = null;
  var videoSafetyTimer = null;
  var progressTimer = null;
  var refreshTimer = null;
  var playlistRevision = '';
  var reloadAfterCurrent = false;
  var pendingPlaylist = null;
  var currentAudio = null;
  var musicIndex = 0;
  var failuresInCycle = 0;
  var startedAt = new Date().getTime();
  var pendingAudioStart = null;
  var currentMediaElement = null;
  var videoWatchdogTimer = null;
  var currentVideoRetryCount = 0;
  var pendingResumeTime = 0;
  var maintenanceReloadDue = false;
  var deviceId = PlayerCore.queryParam('device');
  var activePlaylistUrls = [];
  var activePlaylistMode = 'global';

  /*
    Layout definido no <head>: window.__PLAYER_LAYOUT__ informa se estamos em
    modo device (Android WebView/APK, sem piso de 1280x720 e meta
    width=device-width) e o modo de enquadramento (contain/cover/stretch).
    Em Tizen/desktop o comportamento original é preservado.
  */
  var LAYOUT = window.__PLAYER_LAYOUT__ || { deviceMode: false, fitMode: 'contain' };

  var VIDEO_STALL_TIMEOUT_MS = 20000;
  var VIDEO_RETRY_DELAY_MS = 2000;
  var VIDEO_RETRY_LIMIT = 2;

  var stageOuter = document.getElementById('stage-outer');
  var stageInner = document.getElementById('stage-inner');
  var message = document.getElementById('message');
  var messageTitle = document.getElementById('message-title');
  var messageText = document.getElementById('message-text');
  var progressBar = document.getElementById('progress-bar');
  var hud = document.getElementById('hud');

  /*
    Utilidades puras, requisição JSON, normalização de playlist e camada de
    devices/playlist vivem em player-core.js (PlayerCore). Este arquivo
    mantém apenas a lógica de reprodução e mensagens de tela.
  */

  function showMessage(title, text) {
    messageTitle.innerHTML = title;
    messageText.innerHTML = text;
    message.style.display = 'block';
    stageOuter.style.visibility = 'hidden';
    progressBar.style.width = '0%';
  }

  function hideMessage() {
    message.style.display = 'none';
    stageOuter.style.visibility = 'visible';
  }

  function pad2(number) {
    var text = String(number);
    return text.length < 2 ? '0' + text : text;
  }

  function updateHud() {
    var now;
    var position;
    var updateNotice;
    if (!CONFIG.showHud) {
      hud.style.display = 'none';
      return;
    }
    hud.style.display = 'block';
    now = new Date();
    position = playlist.length && index >= 0 ? (index + 1) + '/' + playlist.length : '';
    updateNotice = reloadAfterCurrent
      ? '  ↻ NOVO CONTEÚDO'
      : (maintenanceReloadDue ? '  ↻ MANUTENÇÃO PENDENTE' : '');
    hud.innerHTML = (deviceId ? PlayerCore.escapeHtml(deviceId) + '  ' : '') + position + updateNotice + '  ' +
      pad2(now.getHours()) + ':' + pad2(now.getMinutes());
  }

  function viewportSize() {
    var stageWidth = Number(stageOuter.clientWidth) || 0;
    var stageHeight = Number(stageOuter.clientHeight) || 0;
    var documentWidth = document.documentElement
      ? Number(document.documentElement.clientWidth) || 0
      : 0;
    var documentHeight = document.documentElement
      ? Number(document.documentElement.clientHeight) || 0
      : 0;
    var bodyWidth = document.body ? Number(document.body.clientWidth) || 0 : 0;
    var bodyHeight = document.body ? Number(document.body.clientHeight) || 0 : 0;

    return {
      width: Math.max(
        stageWidth,
        Number(window.innerWidth) || 0,
        documentWidth,
        bodyWidth,
        LAYOUT.deviceMode ? 0 : 1280
      ),
      height: Math.max(
        stageHeight,
        Number(window.innerHeight) || 0,
        documentHeight,
        bodyHeight,
        LAYOUT.deviceMode ? 0 : 720
      )
    };
  }

  function fitToScreen(element, naturalWidth, naturalHeight) {
    var viewport;
    var scale;
    var mode = String(LAYOUT.fitMode || 'contain').toLowerCase();
    var displayWidth;
    var displayHeight;
    if (!naturalWidth || !naturalHeight) {
      naturalWidth = 16;
      naturalHeight = 9;
    }
    viewport = viewportSize();
    if (mode === 'stretch') {
      displayWidth = viewport.width;
      displayHeight = viewport.height;
    } else if (mode === 'cover') {
      /* Preenche o palco inteiro; o excesso é cortado simetricamente. */
      scale = Math.max(viewport.width / naturalWidth, viewport.height / naturalHeight);
      displayWidth = Math.floor(naturalWidth * scale);
      displayHeight = Math.floor(naturalHeight * scale);
    } else {
      mode = 'contain';
      scale = Math.min(viewport.width / naturalWidth, viewport.height / naturalHeight);
      displayWidth = Math.floor(naturalWidth * scale);
      displayHeight = Math.floor(naturalHeight * scale);
    }
    element.style.width = displayWidth + 'px';
    element.style.height = displayHeight + 'px';
    if (mode === 'contain') {
      /* Comportamento original: centralizado pelo #stage-inner (table-cell). */
      element.style.position = '';
      element.style.margin = '';
      element.style.left = '';
      element.style.top = '';
    } else {
      /* cover/stretch excedem o palco: posiciona absoluto e centralizado,
         para o corte ficar simétrico nas quatro bordas. */
      element.style.position = 'absolute';
      element.style.margin = '0';
      element.style.left = Math.floor((viewport.width - displayWidth) / 2) + 'px';
      element.style.top = Math.floor((viewport.height - displayHeight) / 2) + 'px';
    }
  }

  function fitVideo(element) {
    fitToScreen(element, Number(element.videoWidth) || 16, Number(element.videoHeight) || 9);
  }

  function refitCurrentMedia() {
    if (!currentMediaElement) { return; }
    if (String(currentMediaElement.tagName).toLowerCase() === 'video') {
      fitVideo(currentMediaElement);
      return;
    }
    fitToScreen(
      currentMediaElement,
      currentMediaElement.naturalWidth,
      currentMediaElement.naturalHeight
    );
  }

  function applyBorderColor(mediaElement, naturalWidth, naturalHeight) {
    var maxSize;
    var aspect;
    var canvasWidth;
    var canvasHeight;
    var canvas;
    var context;
    var data;
    var red = 0;
    var green = 0;
    var blue = 0;
    var alphaTotal = 0;
    var x;
    var y;
    var offset;
    var alpha;

    if (!CONFIG.fillBorderColor) {
      stageOuter.style.backgroundColor = '#050505';
      return;
    }

    try {
      if (!naturalWidth || !naturalHeight) { throw new Error('sem dimensões'); }
      maxSize = 60;
      aspect = naturalWidth / naturalHeight;
      canvasWidth = aspect >= 1 ? maxSize : Math.max(1, Math.round(maxSize * aspect));
      canvasHeight = aspect >= 1 ? Math.max(1, Math.round(maxSize / aspect)) : maxSize;
      canvas = document.createElement('canvas');
      canvas.width = canvasWidth;
      canvas.height = canvasHeight;
      context = canvas.getContext('2d');
      context.drawImage(mediaElement, 0, 0, canvasWidth, canvasHeight);
      data = context.getImageData(0, 0, canvasWidth, canvasHeight).data;

      for (y = 0; y < canvasHeight; y++) {
        for (x = 0; x < canvasWidth; x++) {
          if (x === 0 || y === 0 || x === canvasWidth - 1 || y === canvasHeight - 1) {
            offset = (y * canvasWidth + x) * 4;
            alpha = data[offset + 3] / 255;
            red += data[offset] * alpha;
            green += data[offset + 1] * alpha;
            blue += data[offset + 2] * alpha;
            alphaTotal += alpha;
          }
        }
      }

      if (alphaTotal < 0.5) { throw new Error('borda transparente'); }
      stageOuter.style.backgroundColor =
        'rgb(' + Math.round(red / alphaTotal) + ',' +
        Math.round(green / alphaTotal) + ',' +
        Math.round(blue / alphaTotal) + ')';
    } catch (error) {
      stageOuter.style.backgroundColor = '#050505';
    }
  }

  function clearVideoWatchdog() {
    if (videoWatchdogTimer) {
      clearTimeout(videoWatchdogTimer);
      videoWatchdogTimer = null;
    }
  }

  function retryVideo(item, detail) {
    var resumeAt = pendingResumeTime;

    if (currentMediaElement) {
      try {
        resumeAt = Math.max(
          resumeAt,
          Number(currentMediaElement.currentTime) || 0,
          Number(currentMediaElement._resumeTime) || 0
        );
      } catch (error) {}
    }

    if (currentVideoRetryCount >= VIDEO_RETRY_LIMIT) {
      currentVideoRetryCount = 0;
      pendingResumeTime = 0;
      mediaFailed(item, detail);
      return;
    }

    currentVideoRetryCount += 1;
    pendingResumeTime = Math.max(0, resumeAt - 3);
    clearPlayback();
    showMessage(
      'Reconectando vídeo',
      'A reprodução ficou sem avançar. Tentativa ' + currentVideoRetryCount +
      ' de ' + VIDEO_RETRY_LIMIT + '...'
    );
    advanceTimer = setTimeout(function () {
      advanceTimer = null;
      hideMessage();
      renderCurrent();
    }, VIDEO_RETRY_DELAY_MS);
  }

  function armVideoWatchdog(element, item) {
    var lastTime;

    if (!element || element !== currentMediaElement) { return; }
    clearVideoWatchdog();
    try { lastTime = Number(element.currentTime) || 0; } catch (error) { lastTime = 0; }

    videoWatchdogTimer = setTimeout(function checkProgress() {
      var currentTime;
      videoWatchdogTimer = null;
      if (element !== currentMediaElement || element.ended || pendingAudioStart) { return; }
      if (element.paused || element.seeking) { return; }

      try { currentTime = Number(element.currentTime) || 0; } catch (error) { currentTime = 0; }
      if (currentTime <= lastTime + 0.25) {
        retryVideo(item, 'O vídeo permaneceu travado por mais de 20 segundos.');
        return;
      }

      lastTime = currentTime;
      videoWatchdogTimer = setTimeout(checkProgress, VIDEO_STALL_TIMEOUT_MS);
    }, VIDEO_STALL_TIMEOUT_MS);
  }

  function clearPlayback() {
    pendingAudioStart = null;
    document.removeEventListener('click', resumePlaybackWithAudio, false);
    document.removeEventListener('keydown', resumePlaybackWithAudio, false);
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
    if (videoSafetyTimer) { clearTimeout(videoSafetyTimer); videoSafetyTimer = null; }
    clearVideoWatchdog();
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    if (currentAudio) {
      try { currentAudio.pause(); } catch (error) {}
      currentAudio.src = '';
      currentAudio = null;
    }
    if (currentMediaElement) {
      currentMediaElement.onerror = null;
      currentMediaElement.onended = null;
      currentMediaElement.onwaiting = null;
      currentMediaElement.onstalled = null;
      currentMediaElement.onplaying = null;
      try {
        if (typeof currentMediaElement.pause === 'function') {
          currentMediaElement.pause();
        }
        currentMediaElement.removeAttribute('src');
        currentMediaElement.src = '';
        if (typeof currentMediaElement.load === 'function') {
          currentMediaElement.load();
        }
      } catch (error) {}
    }
    currentMediaElement = null;
    stageInner.innerHTML = '';
  }

  function startTimedProgress(seconds) {
    var start = new Date().getTime();
    var total = seconds * 1000;
    progressBar.style.width = '0%';
    progressTimer = setInterval(function () {
      var elapsed = new Date().getTime() - start;
      var percent = Math.min(100, elapsed / total * 100);
      progressBar.style.width = percent + '%';
    }, 250);
  }

  function mediaFailed(item, detail) {
    if (maintenanceReloadDue) {
      window.location.reload();
      return;
    }
    if (reloadAfterCurrent) {
      activatePendingPlaylist();
      return;
    }
    failuresInCycle += 1;
    if (failuresInCycle >= playlist.length) {
      clearPlayback();
      showMessage(
        'Nenhuma mídia pôde ser reproduzida',
        'Último arquivo: <code>' + PlayerCore.escapeHtml(item.name) + '</code><br>' +
        detail + '<br>A playlist será verificada novamente em breve.'
      );
      setTimeout(refreshPlaylist, 60000);
      return;
    }
    advance();
  }

  function requestAudioStart(element, item) {
    pendingAudioStart = { element: element, item: item };
    showMessage(
      'Áudio aguardando autorização',
      'O navegador bloqueou o início automático com som.<br>' +
      'Pressione <code>OK/Enter</code> ou clique na tela para começar com o áudio ligado.'
    );
    document.addEventListener('click', resumePlaybackWithAudio, false);
    document.addEventListener('keydown', resumePlaybackWithAudio, false);
  }

  function resumePlaybackWithAudio(event) {
    var code;
    var pending;
    var playResult;

    if (!pendingAudioStart) { return; }
    if (event && event.type === 'keydown') {
      code = event.keyCode || event.which;
      if (code !== 13 && code !== 32) { return; }
    }

    pending = pendingAudioStart;
    pendingAudioStart = null;
    document.removeEventListener('click', resumePlaybackWithAudio, false);
    document.removeEventListener('keydown', resumePlaybackWithAudio, false);
    pending.element.muted = false;
    pending.element.removeAttribute('muted');

    try {
      playResult = pending.element.play();
      if (playResult && typeof playResult.catch === 'function') {
        playResult.then(hideMessage).catch(function () {
          mediaFailed(pending.item, 'O navegador não autorizou a reprodução com áudio.');
        });
      } else {
        hideMessage();
      }
    } catch (error) {
      mediaFailed(pending.item, 'O navegador não autorizou a reprodução com áudio.');
    }
  }

  function playVideoWithAudio(element, item) {
    var playResult;
    element.muted = false;
    element.removeAttribute('muted');

    try {
      playResult = element.play();
      if (playResult && typeof playResult.catch === 'function') {
        playResult.catch(function () {
          requestAudioStart(element, item);
        });
      }
    } catch (error) {
      requestAudioStart(element, item);
    }
  }

  function queuePlaylistUpdate(updated, updatedRevision) {
    pendingPlaylist = updated;
    playlistRevision = updatedRevision;
    reloadAfterCurrent = true;
    updateHud();
  }

  function activatePendingPlaylist() {
    var previousIndex = index;
    var currentIndex = -1;
    var i;

    if (!reloadAfterCurrent || pendingPlaylist === null) {
      advance();
      return;
    }

    playlist = pendingPlaylist;
    pendingPlaylist = null;
    reloadAfterCurrent = false;

    for (i = 0; i < playlist.length; i++) {
      if (playlist[i].id === currentId) {
        currentIndex = i;
        break;
      }
    }

    if (currentIndex >= 0) {
      index = currentIndex;
    } else {
      index = Math.max(-1, Math.min(previousIndex - 1, playlist.length - 1));
    }

    updateHud();
    if (!playlist.length) {
      clearPlayback();
      currentId = null;
      index = -1;
      showMessage('Nenhuma mídia publicada', 'Envie um vídeo pelo painel administrativo.');
      schedulePlaylistRefresh();
      return;
    }

    hideMessage();
    failuresInCycle = 0;
    advance();
    schedulePlaylistRefresh();
  }

  function restartSingleVideo() {
    var item = playlist[index];
    var element = currentMediaElement;
    var duration;

    if (!item || item.type !== 'video' || playlist.length !== 1 || !element) {
      advance();
      return;
    }

    failuresInCycle = 0;
    currentVideoRetryCount = 0;
    pendingResumeTime = 0;
    clearVideoWatchdog();
    if (videoSafetyTimer) {
      clearTimeout(videoSafetyTimer);
      videoSafetyTimer = null;
    }
    progressBar.style.width = '0%';

    try {
      element.currentTime = 0;
      playVideoWithAudio(element, item);
      armVideoWatchdog(element, item);
      duration = Number(element.duration) || Number(item.durationSeconds) || 14400;
      videoSafetyTimer = setTimeout(function () {
        retryVideo(item, 'O vídeo em loop ultrapassou o tempo esperado.');
      }, (duration + 90) * 1000);
    } catch (error) {
      retryVideo(item, 'A TV não conseguiu reiniciar o vídeo em loop.');
      return;
    }

    schedulePlaylistRefresh();
  }

  function finishCurrent() {
    failuresInCycle = 0;
    currentVideoRetryCount = 0;
    pendingResumeTime = 0;
    if (maintenanceReloadDue) {
      window.location.reload();
      return;
    }
    if (reloadAfterCurrent) {
      activatePendingPlaylist();
      return;
    }

    if (!activePlaylistUrls.length || !playlistRevision) {
      if (playlist.length === 1 && playlist[0].type === 'video') {
        restartSingleVideo();
      } else {
        advance();
      }
      return;
    }

    if (refreshTimer) {
      clearTimeout(refreshTimer);
      refreshTimer = null;
    }
    PlayerCore.fetchActivePlaylist({
      deviceId: deviceId,
      bootstrap: BOOTSTRAP,
      urls: activePlaylistUrls,
      mode: activePlaylistMode,
      onSuccess: function (data) {
        var updated = PlayerCore.normalizePlaylist(data);
        var updatedRevision = PlayerCore.revisionOf(data, updated);
        if (updatedRevision !== playlistRevision) {
          queuePlaylistUpdate(updated, updatedRevision);
          activatePendingPlaylist();
          return;
        }
        playlistRevision = updatedRevision;
        if (playlist.length === 1 && playlist[0].type === 'video') {
          restartSingleVideo();
        } else {
          advance();
          schedulePlaylistRefresh();
        }
      },
      onError: function () {
        if (playlist.length === 1 && playlist[0].type === 'video') {
          restartSingleVideo();
        } else {
          advance();
          schedulePlaylistRefresh(
            Math.max(1, Number(CONFIG.pollIntervalMinutes) || 5) * 60 * 1000
          );
        }
      }
    });
  }

  function renderCurrent() {
    var item = playlist[index];
    var element;
    var duration;
    var override;
    var resumeTime;

    if (!item) { return; }
    currentId = item.id || item.name;
    updateHud();
    stageInner.innerHTML = '';
    progressBar.style.width = '0%';

    if (item.type === 'image') {
      element = document.createElement('img');
      currentMediaElement = element;
      element.crossOrigin = 'anonymous';
      element.alt = item.name;
      element.onload = function () {
        fitToScreen(element, element.naturalWidth, element.naturalHeight);
        applyBorderColor(element, element.naturalWidth, element.naturalHeight);
      };
      element.onerror = function () { mediaFailed(item, 'Falha ao carregar a imagem.'); };
      stageInner.appendChild(element);
      element.src = item.url;

      duration = CONFIG.imageDurationSeconds;
      if (CONFIG.musicEnabled && CONFIG.musicPlaylist.length > 0) {
        currentAudio = document.createElement('audio');
        currentAudio.src = CONFIG.musicPlaylist[musicIndex % CONFIG.musicPlaylist.length];
        currentAudio.volume = CONFIG.musicVolume;
        musicIndex += 1;
        try { currentAudio.play(); } catch (error) {}
        duration = CONFIG.imageMusicDurationSeconds;
      }
      startTimedProgress(duration);
      advanceTimer = setTimeout(finishCurrent, duration * 1000);
      return;
    }

    element = document.createElement('video');
    currentMediaElement = element;
    stageOuter.style.backgroundColor = '#050505';
    element.autoplay = true;
    element.muted = false;
    override = CONFIG.videoVolumeOverrides && CONFIG.videoVolumeOverrides[item.name];
    element.volume = override !== undefined ? Number(override) : Number(CONFIG.targetVolume);
    element.setAttribute('playsinline', 'true');
    element.setAttribute('preload', 'auto');
    element.setAttribute('tabindex', '0');
    resumeTime = pendingResumeTime;
    pendingResumeTime = 0;
    element._resumeTime = resumeTime;
    fitVideo(element);

    element.onloadedmetadata = function () {
      fitVideo(element);
      if (element._resumeTime > 0) {
        try {
          element.currentTime = Math.min(
            element._resumeTime,
            Math.max(0, Number(element.duration) - 1)
          );
          element._resumeTime = 0;
        } catch (error) {}
      }
      if (videoSafetyTimer) { clearTimeout(videoSafetyTimer); }
      duration = Number(element.duration) || Number(item.durationSeconds) || 14400;
      videoSafetyTimer = setTimeout(function () {
        retryVideo(item, 'O vídeo ultrapassou o tempo esperado.');
      }, (duration + 90) * 1000);
    };
    element.onloadeddata = function () {
      fitVideo(element);
    };
    element.oncanplay = function () {
      fitVideo(element);
    };
    element.onplaying = function () {
      fitVideo(element);
      armVideoWatchdog(element, item);
    };
    element.onwaiting = function () {
      armVideoWatchdog(element, item);
    };
    element.onstalled = function () {
      armVideoWatchdog(element, item);
    };
    element.ontimeupdate = function () {
      if (element.duration && isFinite(element.duration)) {
        progressBar.style.width =
          Math.min(100, element.currentTime / element.duration * 100) + '%';
      }
    };
    element.onended = function () {
      finishCurrent();
    };
    element.onerror = function () {
      var code = element.error ? element.error.code : 'desconhecido';
      retryVideo(item, 'Erro de vídeo ' + code + '.');
    };

    stageInner.appendChild(element);
    element.src = item.url;
    try { element.load(); } catch (error) {}
    playVideoWithAudio(element, item);

    videoSafetyTimer = setTimeout(function () {
      retryVideo(item, 'A TV não iniciou o vídeo.');
    }, 120000);
  }

  function advance() {
    clearPlayback();
    if (!playlist.length) { return; }
    currentVideoRetryCount = 0;
    pendingResumeTime = 0;
    index = (index + 1) % playlist.length;
    renderCurrent();
  }

  function refreshPlaylist() {
    if (!BOOTSTRAP.playlistUrl) {
      showMessage(
        'Player ainda não configurado',
        'Preencha <code>playlistUrl</code> no arquivo <code>player-config.json</code>.'
      );
      return;
    }

    PlayerCore.fetchActivePlaylist({
      deviceId: deviceId,
      bootstrap: BOOTSTRAP,
      urls: activePlaylistUrls,
      mode: activePlaylistMode,
      onSuccess: function (data) {
        var updated = PlayerCore.normalizePlaylist(data);
        var updatedRevision = PlayerCore.revisionOf(data, updated);
        var i;

        if (playlistRevision && updatedRevision !== playlistRevision) {
          queuePlaylistUpdate(updated, updatedRevision);
          if (!currentId || stageInner.innerHTML === '') {
            activatePendingPlaylist();
            return;
          }
          schedulePlaylistRefresh();
          return;
        }

        if (reloadAfterCurrent) {
          pendingPlaylist = updated;
          schedulePlaylistRefresh();
          return;
        }

        playlistRevision = updatedRevision;
        playlist = updated;

        if (!playlist.length) {
          clearPlayback();
          index = -1;
          showMessage('Nenhuma mídia publicada', 'Envie um vídeo pelo painel administrativo.');
          schedulePlaylistRefresh();
          return;
        }

        if (currentId) {
          for (i = 0; i < playlist.length; i++) {
            if (playlist[i].id === currentId) {
              index = i;
              break;
            }
          }
        }

        if (stageInner.innerHTML === '' || index === -1) {
          hideMessage();
          index = -1;
          failuresInCycle = 0;
          advance();
        }
        schedulePlaylistRefresh();
      },
      onError: function (error) {
        if (!playlist.length) {
          showMessage('Falha ao carregar playlist', error);
        }
        schedulePlaylistRefresh(
          Math.max(1, Number(CONFIG.pollIntervalMinutes) || 5) * 60 * 1000
        );
      }
    });
  }

  function schedulePlaylistRefresh(delayMs) {
    if (refreshTimer) { clearTimeout(refreshTimer); }
    refreshTimer = null;
    /*
      Enquanto houver mídia em reprodução, a playlist é consultada apenas
      entre uma mídia e outra (finishCurrent), inclusive quando um único
      vídeo está em loop. Isso evita trabalho de rede durante a reprodução
      e mantém a troca de conteúdo confinada ao limite entre mídias.
      Um delayMs explícito (retentativas após falha) sempre é agendado.
    */
    if (delayMs === undefined && currentMediaElement) { return; }
    refreshTimer = setTimeout(
      refreshPlaylist,
      delayMs || Math.max(2, Number(BOOTSTRAP.playlistCheckSeconds) || 5) * 1000
    );
  }

  function start() {
    updateHud();
    setInterval(updateHud, 15000);
    if (window.addEventListener) {
      window.addEventListener('resize', refitCurrentMedia, false);
    } else {
      window.onresize = refitCurrentMedia;
    }
    PlayerCore.resolveDevice({
      deviceId: deviceId,
      bootstrap: BOOTSTRAP,
      notify: showMessage,
      onFatal: showMessage,
      onReady: function (device) {
        activePlaylistUrls = device.urls;
        activePlaylistMode = device.mode;
        PlayerCore.loadRuntimeConfig({
          configUrl: BOOTSTRAP.configUrl,
          config: CONFIG,
          onDone: function () {
            refreshPlaylist();
            if (CONFIG.autoReloadHours > 0) {
              setTimeout(function () {
                maintenanceReloadDue = true;
                updateHud();
              }, CONFIG.autoReloadHours * 60 * 60 * 1000);
            }
          }
        });
      }
    });
  }

  PlayerCore.loadBootstrap({
    onReady: function (remoteBootstrap) {
      PlayerCore.merge(BOOTSTRAP, remoteBootstrap);
      start();
    },
    onFatal: function (title, text) {
      showMessage(title, text);
    }
  });
})();
</script>
</body>
</html>
