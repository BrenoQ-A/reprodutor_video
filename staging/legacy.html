<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Player Legacy - Staging</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; min-width: 1280px; min-height: 720px; background: #050505; color: #ededed; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
  #status { position: absolute; left: 0; top: 45%; width: 100%; text-align: center; font-size: 16px; }
  #detail { display: block; margin-top: 10px; color: #b8b8b4; font-size: 13px; }
</style>
</head>
<body>
<div id="status">Carregando player legado de staging<span id="detail">Produção permanece isolada.</span></div>
<script>
(function () {
  var xhr = new XMLHttpRequest();
  var url = '../legacy.html?t=' + new Date().getTime();
  var status = document.getElementById('status');
  xhr.open('GET', url, true);
  xhr.timeout = 30000;
  xhr.onreadystatechange = function () {
    var response;
    var endGuard;
    if (xhr.readyState !== 4) { return; }
    if (xhr.status >= 200 && xhr.status < 300) {
      /*
        Alguns WebKit antigos chegam ao fim do MP4, mas não executam o loop
        nativo nem disparam o evento ended de forma confiável. No staging,
        instalamos um guardião externo que reutiliza o próprio onended do
        player principal quando detecta o vídeo parado no limite final.
      */
      endGuard = '<script>(function(){' +
        'var video=document.getElementById("video");' +
        'var busy=false;var pausedEndTicks=0;' +
        'function number(v){v=Number(v);return isFinite(v)?v:0;}' +
        'function tick(){var duration,current,atPausedEnd=false;' +
          'if(!video||busy){return;}' +
          'duration=number(video.duration);current=number(video.currentTime);' +
          'if(duration>0&&video.paused&&current>=Math.max(0,duration-0.75)){pausedEndTicks+=1;}else{pausedEndTicks=0;}' +
          'atPausedEnd=pausedEndTicks>=2;' +
          'if(!video.ended&&!atPausedEnd){return;}' +
          'busy=true;pausedEndTicks=0;' +
          'setTimeout(function(){busy=false;},4000);' +
          'if(typeof video.onended==="function"){try{video.onended();return;}catch(e){}}' +
          'try{video.currentTime=0;}catch(e2){}' +
          'try{video.load();}catch(e3){}' +
          'try{video.play();}catch(e4){}' +
        '}' +
        'setInterval(tick,1000);' +
      '})();<\/script>';
      response = xhr.responseText.replace('</body>', endGuard + '</body>');
      document.open();
      document.write(response);
      document.close();
      return;
    }
    status.innerHTML = 'Falha ao carregar o player legado de staging<span id="detail">HTTP ' + xhr.status + '</span>';
  };
  xhr.onerror = function () {
    status.innerHTML = 'Falha ao carregar o player legado de staging<span id="detail">Erro de rede.</span>';
  };
  xhr.ontimeout = function () {
    status.innerHTML = 'Falha ao carregar o player legado de staging<span id="detail">Tempo de carregamento esgotado.</span>';
  };
  xhr.send();
})();
</script>
</body>
</html>
