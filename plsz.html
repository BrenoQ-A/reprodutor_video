<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Player de Sinalização - Legacy TV</title>
<style>
html, body { margin:0; padding:0; width:100%; height:100%; background:#050505; overflow:hidden; font-family:Arial,Helvetica,sans-serif; }
#stage { position:fixed; left:0; top:0; right:0; bottom:0; width:100%; height:100%; overflow:hidden; background:#050505; }
#video, #image { position:absolute; display:none; left:0; top:0; margin:0; padding:0; border:0; max-width:none; max-height:none; }
#message { position:absolute; left:0; top:0; right:0; bottom:0; display:table; width:100%; height:100%; background:#050505; color:#ededed; text-align:center; z-index:10; }
#message-inner { display:table-cell; vertical-align:middle; padding:20px; }
#message-title { font-size:18px; margin-bottom:10px; }
#message-text { font-size:14px; color:#b8b8b4; line-height:1.5; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" preload="auto" autoplay playsinline webkit-playsinline></video>
  <img id="image" alt="">
</div>
<div id="message"><div id="message-inner"><div id="message-title">Iniciando player leve</div><div id="message-text">Carregando configuração...</div></div></div>
<script>
(function () {
  var BOOTSTRAP={playlistUrl:'',devicesUrl:'',configUrl:'',playlistCheckSeconds:60};
  var CONFIG={imageDurationSeconds:15,targetVolume:0.8,videoVolumeOverrides:{},musicEnabled:false,musicPlaylist:[],imageMusicDurationSeconds:40,musicVolume:0.5,legacyFitMode:'cover',legacyCanvasWidth:1280,legacyCanvasHeight:720};
  var IMAGE_EXT=['jpg','jpeg','png'], VIDEO_EXT=['mp4'];
  var STALL_CHECK_MS=15000, STALL_LIMIT_MS=30000, RETRY_DELAY_MS=1500, MAX_RECOVERY_ATTEMPTS=3;
  var stage=document.getElementById('stage'), video=document.getElementById('video'), image=document.getElementById('image');
  var message=document.getElementById('message'), messageTitle=document.getElementById('message-title'), messageText=document.getElementById('message-text');
  var playlist=[], pendingPlaylist=null, playlistRevision='', index=-1, currentId='', currentType='';
  var imageTimer=null, playlistTimer=null, retryTimer=null, currentAudio=null, waitingForAudio=false;
  var lastVideoTime=0, lastProgressAt=0, retryCount=0, recoveryAttempts=0, nativeLoopEnabled=false;
  var deviceId=queryValue('device'), activePlaylistUrls=[], activePlaylistMode='global', refitTimer=null;

  function contains(a,v){var i;for(i=0;i<a.length;i++){if(a[i]===v)return true;}return false;}
  function extOf(n){var p=String(n||'').split('.');return p.length>1?p[p.length-1].toLowerCase():'';}
  function merge(t,s){var k;if(!s)return t;for(k in s){if(s.hasOwnProperty(k))t[k]=s[k];}return t;}
  function queryValue(n){var s=String(window.location.search||'').replace(/^\?/,''),p=s?s.split('&'):[],i,x;for(i=0;i<p.length;i++){x=p[i].split('=');if(decodeURIComponent(x[0]||'')===n)return decodeURIComponent(x.slice(1).join('=')||'');}return '';}
  function applyQueryOverrides(){var f=String(queryValue('fit')||'').toLowerCase();if(f==='contain'||f==='cover'||f==='stretch')CONFIG.legacyFitMode=f;}
  function cacheBust(u){return u+(u.indexOf('?')===-1?'?':'&')+'t='+new Date().getTime();}
  function requestJson(u,ok,fail){var x=new XMLHttpRequest();x.open('GET',cacheBust(u),true);x.timeout=30000;x.onreadystatechange=function(){var d;if(x.readyState!==4)return;if(x.status>=200&&x.status<300){try{d=JSON.parse(x.responseText);ok(d);}catch(e){fail('JSON inválido.');}}else fail('HTTP '+x.status+'.');};x.onerror=function(){fail('Falha de rede.');};x.ontimeout=function(){fail('Tempo de rede esgotado.');};x.send();}
  function siblingUrl(u,p){return String(u||'').split('?')[0].replace(/[^/]*$/,p);}
  function showMessage(t,x){messageTitle.innerHTML=t;messageText.innerHTML=x;message.style.display='table';}
  function hideMessage(){message.style.display='none';}

  function viewportSize(){
    var d=document.documentElement,w=Number(window.innerWidth)||0,h=Number(window.innerHeight)||0;
    if((!w||!h)&&d){w=Number(d.clientWidth)||w;h=Number(d.clientHeight)||h;}
    if((!w||!h)&&stage){w=Number(stage.clientWidth)||w;h=Number(stage.clientHeight)||h;}
    if(!w)w=Number(CONFIG.legacyCanvasWidth)||1280;
    if(!h)h=Number(CONFIG.legacyCanvasHeight)||720;
    return {width:Math.max(1,w),height:Math.max(1,h)};
  }
  function fitElement(el,nw,nh){
    var v=viewportSize(),w=Number(nw)||16,h=Number(nh)||9,m=String(CONFIG.legacyFitMode||'cover').toLowerCase(),s,dw,dh;
    if(m==='stretch'){dw=v.width;dh=v.height;}else{s=m==='contain'?Math.min(v.width/w,v.height/h):Math.max(v.width/w,v.height/h);dw=Math.max(1,Math.ceil(w*s));dh=Math.max(1,Math.ceil(h*s));}
    el.style.width=dw+'px';el.style.height=dh+'px';el.style.left=Math.floor((v.width-dw)/2)+'px';el.style.top=Math.floor((v.height-dh)/2)+'px';
  }
  function refit(){if(currentType==='video'&&video.style.display!=='none')fitElement(video,video.videoWidth,video.videoHeight);else if(currentType==='image'&&image.style.display!=='none')fitElement(image,image.naturalWidth,image.naturalHeight);}
  function scheduleRefit(){if(refitTimer)clearTimeout(refitTimer);refitTimer=setTimeout(function(){refitTimer=null;refit();},150);}

  function applyDeviceRegistry(r){var f,i;for(i=0;r&&r.devices&&i<r.devices.length;i++){if(String(r.devices[i].id)===deviceId){f=r.devices[i];break;}}if(!f)return false;activePlaylistMode=f.playlistMode||'global';if(activePlaylistMode==='individual')activePlaylistUrls=[siblingUrl(BOOTSTRAP.devicesUrl,'devices/'+deviceId+'/playlist.json')];else if(activePlaylistMode==='mixed')activePlaylistUrls=[BOOTSTRAP.playlistUrl,siblingUrl(BOOTSTRAP.devicesUrl,'devices/'+deviceId+'/playlist.json')];else activePlaylistUrls=[BOOTSTRAP.playlistUrl];return true;}
  function resolveDevice(done){if(!deviceId){activePlaylistUrls=[BOOTSTRAP.playlistUrl];done();return;}if(!BOOTSTRAP.devicesUrl){showMessage('Cadastro de TVs indisponível','O endereço do cadastro não foi configurado.');return;}requestJson(BOOTSTRAP.devicesUrl,function(r){if(!applyDeviceRegistry(r)){showMessage('TV não cadastrada','O identificador desta TV não existe no painel.');return;}done();},function(){showMessage('Aguardando rede','Não foi possível identificar esta TV.');});}
  function requestActivePlaylist(ok,fail){
    function sources(){var pending=activePlaylistUrls.length,res=[],failed=false,i;if(!pending){fail();return;}function finish(){var items=[],seen={},rev=[],src,it,sig,x,y;for(x=0;x<res.length;x++){src=res[x]&&res[x].items?res[x].items:res[x];rev.push(res[x]&&res[x].updatedAt?res[x].updatedAt:'');for(y=0;src&&y<src.length;y++){it=src[y];sig=String(it&&(it.id||it.key||it.url||it.name));if(!seen[sig]){seen[sig]=true;items.push(it);}}}ok({items:items,updatedAt:activePlaylistMode+'|'+rev.join('|')});}for(i=0;i<activePlaylistUrls.length;i++){(function(pos){requestJson(activePlaylistUrls[pos],function(d){res[pos]=d||{items:[]};pending--;if(!pending&&!failed)finish();},function(){if(!failed){failed=true;fail();}});})(i);}}
    if(deviceId&&BOOTSTRAP.devicesUrl)requestJson(BOOTSTRAP.devicesUrl,function(r){if(!applyDeviceRegistry(r)){fail();return;}sources();},sources);else sources();
  }
  function normalizePlaylist(d){var src=d&&d.items?d.items:d,r=[],seen={},i,it,e,t,s;if(!src||typeof src.length!=='number')return r;for(i=0;i<src.length;i++){it=src[i];if(!it||!it.url||!it.name)continue;e=extOf(it.name);if(it.type==='video'||contains(VIDEO_EXT,e))t='video';else if(it.type==='image'||contains(IMAGE_EXT,e))t='image';else continue;s=String(it.contentHash||it.id||it.key||it.url);if(seen[s])continue;seen[s]=true;r.push({id:it.id||it.key||it.name,name:it.name,url:it.url,type:t,durationSeconds:it.durationSeconds});}return r;}
  function revisionOf(d,n){var p=[],i;if(d&&d.updatedAt)return String(d.updatedAt);for(i=0;i<n.length;i++)p.push(String(n[i].id)+'|'+String(n[i].url));return p.join('||');}
  function stopImageAudio(){if(currentAudio){try{currentAudio.pause();}catch(e){}currentAudio.src='';currentAudio=null;}}
  function markPlaybackStarted(){waitingForAudio=false;lastVideoTime=Number(video.currentTime)||0;lastProgressAt=new Date().getTime();hideMessage();}
  function playVideo(){var r;if(currentType!=='video'||!video.src)return;video.muted=false;video.removeAttribute('muted');try{r=video.play();if(r&&typeof r.then==='function'&&typeof r.catch==='function'){r.then(markPlaybackStarted).catch(function(){waitingForAudio=true;showMessage('Áudio aguardando autorização','Pressione OK/Enter ou clique na tela para iniciar.');});return;}}catch(e){waitingForAudio=true;showMessage('Áudio aguardando autorização','Pressione OK/Enter ou clique na tela para iniciar.');}}
  function resumeAudio(e){var c;if(!waitingForAudio)return;if(e&&e.type==='keydown'){c=e.keyCode||e.which;if(c!==13&&c!==32)return;}waitingForAudio=false;playVideo();}
  function setNativeLoop(x){nativeLoopEnabled=!!x;try{video.loop=nativeLoopEnabled;}catch(e){}if(x)video.setAttribute('loop','loop');else video.removeAttribute('loop');}
  function syncNativeLoop(){setNativeLoop(!pendingPlaylist&&playlist.length===1&&playlist[0]&&playlist[0].type==='video');}
  function renderVideo(it){var o;if(imageTimer){clearTimeout(imageTimer);imageTimer=null;}stopImageAudio();image.style.display='none';video.style.display='block';currentType='video';currentId=it.id;o=CONFIG.videoVolumeOverrides&&CONFIG.videoVolumeOverrides[it.name];video.volume=o!==undefined?Number(o):Number(CONFIG.targetVolume);video.src=it.url;fitElement(video,16,9);syncNativeLoop();try{video.load();}catch(e){}playVideo();}
  function renderImage(it){var d=Number(CONFIG.imageDurationSeconds)||15;setNativeLoop(false);try{video.pause();}catch(e){}video.style.display='none';image.style.display='block';currentType='image';currentId=it.id;image.alt=it.name;image.src=it.url;if(CONFIG.musicEnabled&&CONFIG.musicPlaylist&&CONFIG.musicPlaylist.length){currentAudio=document.createElement('audio');currentAudio.src=CONFIG.musicPlaylist[index%CONFIG.musicPlaylist.length];currentAudio.volume=Number(CONFIG.musicVolume)||0.5;try{currentAudio.play();}catch(a){}d=Number(CONFIG.imageMusicDurationSeconds)||40;}imageTimer=setTimeout(finishCurrent,Math.max(1,d)*1000);}
  function renderItem(it){if(!it)return;recoveryAttempts=0;showMessage('Carregando mídia',it.name||'Vídeo');if(it.type==='image')renderImage(it);else renderVideo(it);}
  function applyPendingPlaylist(){var old=currentId,i;if(!pendingPlaylist)return false;playlist=pendingPlaylist;pendingPlaylist=null;index=-1;for(i=0;i<playlist.length;i++){if(playlist[i].id===old){index=i;break;}}return true;}
  function advance(){if(imageTimer){clearTimeout(imageTimer);imageTimer=null;}stopImageAudio();retryCount=0;if(pendingPlaylist)applyPendingPlaylist();if(!playlist.length){currentId='';currentType='';setNativeLoop(false);video.style.display='none';image.style.display='none';showMessage('Nenhuma mídia publicada','O player continuará verificando a playlist.');return;}index=(index+1)%playlist.length;renderItem(playlist[index]);}
  function finishCurrent(){if(pendingPlaylist){applyPendingPlaylist();advance();return;}if(playlist.length===1&&currentType==='video'){try{video.currentTime=0;}catch(e){video.src=playlist[index].url;try{video.load();}catch(x){}}playVideo();return;}advance();}
  function retryCurrent(detail){var it=playlist[index];if(!it||it.type!=='video'){advance();return;}if(retryTimer)return;retryCount++;if(retryCount>3){retryCount=0;showMessage('Falha de reprodução',detail+'<br>A playlist será tentada novamente.');retryTimer=setTimeout(function(){retryTimer=null;renderVideo(it);},10000);return;}showMessage('Recuperando reprodução',detail+'<br>Tentativa '+retryCount+' de 3.');try{video.pause();}catch(e){}retryTimer=setTimeout(function(){retryTimer=null;video.src=it.url;try{video.load();}catch(x){}syncNativeLoop();playVideo();},RETRY_DELAY_MS);}
  function recover(detail){recoveryAttempts++;if(recoveryAttempts>MAX_RECOVERY_ATTEMPTS){showMessage('Reiniciando player',detail+'<br>Recarregando a página.');setTimeout(function(){window.location.reload();},2500);return;}retryCurrent(detail+'<br>Recuperação '+recoveryAttempts+' de '+MAX_RECOVERY_ATTEMPTS+'.');}
  function refreshPlaylist(){if(!BOOTSTRAP.playlistUrl)return;requestActivePlaylist(function(d){var u=normalizePlaylist(d),r=revisionOf(d,u);if(!playlistRevision){playlistRevision=r;playlist=u;if(index===-1)advance();return;}if(r!==playlistRevision){playlistRevision=r;pendingPlaylist=u;if(nativeLoopEnabled)setNativeLoop(false);if(!currentId){applyPendingPlaylist();advance();}}},function(){if(!playlist.length)showMessage('Aguardando rede','Não foi possível consultar a playlist. Tentaremos novamente.');});}
  function startPlaylistPolling(){var s=Math.max(60,Number(BOOTSTRAP.playlistCheckSeconds)||60);if(playlistTimer)clearInterval(playlistTimer);playlistTimer=setInterval(refreshPlaylist,s*1000);}
  function watchdogTick(){var now,t;if(currentType!=='video'||video.style.display==='none'||waitingForAudio||video.seeking||video.ended)return;if(video.paused){playVideo();return;}try{t=Number(video.currentTime)||0;}catch(e){t=0;}now=new Date().getTime();if(t>lastVideoTime+0.2||t<lastVideoTime-1){lastVideoTime=t;lastProgressAt=now;recoveryAttempts=0;return;}if(lastProgressAt&&now-lastProgressAt>=STALL_LIMIT_MS){lastProgressAt=now;recover('O vídeo ficou sem avançar por mais de 30 segundos.');}}
  function loadRuntimeConfig(done){if(!BOOTSTRAP.configUrl){applyQueryOverrides();done();return;}requestJson(BOOTSTRAP.configUrl,function(r){merge(CONFIG,r);applyQueryOverrides();done();},function(){applyQueryOverrides();done();});}

  video.onloadedmetadata=function(){fitElement(video,video.videoWidth,video.videoHeight);lastVideoTime=Number(video.currentTime)||0;lastProgressAt=new Date().getTime();};
  video.onloadeddata=refit;video.oncanplay=function(){refit();if(video.paused&&!waitingForAudio)playVideo();};video.onplay=markPlaybackStarted;video.onplaying=markPlaybackStarted;video.onended=finishCurrent;
  video.onerror=function(){recover('Erro de vídeo '+(video.error?video.error.code:'desconhecido')+'.');};
  image.onload=function(){fitElement(image,image.naturalWidth,image.naturalHeight);hideMessage();};image.onerror=advance;
  document.addEventListener('click',resumeAudio,false);document.addEventListener('keydown',resumeAudio,false);
  if(window.addEventListener){window.addEventListener('resize',scheduleRefit,false);window.addEventListener('orientationchange',scheduleRefit,false);}else window.onresize=scheduleRefit;
  setInterval(watchdogTick,STALL_CHECK_MS);
  requestJson('player-config.json',function(b){merge(BOOTSTRAP,b);if(Number(BOOTSTRAP.playlistCheckSeconds)<60)BOOTSTRAP.playlistCheckSeconds=60;resolveDevice(function(){loadRuntimeConfig(function(){refreshPlaylist();startPlaylistPolling();});});},function(){showMessage('Configuração não encontrada','Não foi possível carregar player-config.json.');});
}());
</script>
<script>
(function(){var hits=0,handling=false;setInterval(function(){var v=document.getElementById('video'),d,c,atEnd;if(!v||v.style.display==='none'||handling){hits=0;return;}try{d=Number(v.duration)||0;c=Number(v.currentTime)||0;}catch(e){hits=0;return;}if(!d||!isFinite(d)){hits=0;return;}atEnd=!!v.ended||c>=Math.max(0,d-0.75);if(!atEnd||(!v.paused&&!v.ended)){hits=0;return;}hits++;if(hits>=2){handling=true;hits=0;try{if(typeof v.onended==='function')v.onended();}catch(x){}setTimeout(function(){handling=false;},5000);}},1000);}());
</script>
</body>
</html>
